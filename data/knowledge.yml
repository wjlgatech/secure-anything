# knowledge.yml — the ecosystem's KNOWLEDGE BASE: the papers, people, labs, books, blogs,
# standards and concepts that a gate decision should be able to cite.
#
# A registry entry answers "what can run?". A knowledge card answers "why is that the right
# thing to run, and who established it?". Both are generated into the flagship skill.
#
# EVIDENCE LADDER (enforced by scripts/verify_knowledge.py — a card may not claim a tier its
# fields cannot support):
#   verified     = read at the PRIMARY source (arXiv API, publisher page, the author's own site)
#                  on verified_at. Requires a resolvable url.
#   corroborated = >=2 independent secondary sources agree; primary not directly read.
#   claimed      = asserted by one interested party (usually a vendor about its own product).
#                  NEVER cite a `claimed` number as a fact.
#   disputed     = sources conflict, or the primary source could not be reached. Kept ON PURPOSE:
#                  a correction retained is worth more than a claim repeated.
#
# All arXiv entries below were resolved through the arXiv API on 2026-08-03 (id -> title, authors,
# publication date all matched). No paper here was cited from memory.

version: "1.0"
updated: "2026-08-03"

