  # ═══════════════════════════ concepts (the load-bearing mental models) ═════════════════════
  - id: lethal-trifecta
    kind: concept
    title: "The lethal trifecta for AI agents"
    by: "Simon Willison"
    url: https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/
    year: 2025
    evidence: corroborated
    verified_at: "2026-08-03"
    summary: >-
      An agent becomes exploitable when it combines three things: access to private data,
      exposure to untrusted content, and the ability to communicate externally. Remove any one
      leg and exfiltration stops being possible.
    why_it_matters: >-
      The single most useful triage question for any agent deployment, and it is architectural
      rather than detection-based — which means it can be gated, not just scanned for.
    covers: [LLM01, LLM02, ASI01, ASI03]
    triggers: ["lethal trifecta", "why did my agent leak", "is this agent safe to deploy", "exfiltration risk", "three legs"]

  - id: agents-rule-of-two
    kind: concept
    title: "The Agents Rule of Two"
    by: "Meta (generalization of the lethal trifecta)"
    url: https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/
    year: 2025
    evidence: claimed
    verified_at: "2026-08-03"
    summary: >-
      An agent session should satisfy at most two of: (a) processing untrusted input,
      (b) accessing sensitive systems, (c) changing state externally.
    why_it_matters: "Turns the trifecta into a deployment rule a policy file can actually encode."
    covers: [LLM06, ASI01, ASI03]
    unconfirmed: >-
      Attributed to Meta via secondary coverage in this session; the primary Meta publication was
      NOT read. The url above points to the related trifecta post, not to a Meta primary source.
      Do not quote as Meta's exact wording until the primary is pinned.
    triggers: ["rule of two", "how much autonomy is safe", "deployment rule"]

  - id: camel-control-flow-integrity
    kind: concept
    title: "Defeating prompt injection by DESIGN (CaMeL): capability-based control-flow integrity for agents"
    by: "Debenedetti et al. (Google DeepMind / ETH)"
    url: https://arxiv.org/abs/2503.18813
    year: 2025
    evidence: verified
    verified_at: "2026-08-03"
    summary: >-
      Rather than trying to detect malicious instructions, CaMeL separates the control plane
      (a plan produced from trusted input) from the data plane (untrusted content), and enforces
      capability constraints on what the plan may do — borrowing control-flow integrity and
      capability security from systems security.
    why_it_matters: >-
      The strongest argument that agent security is an ARCHITECTURE problem, not a classifier
      problem. It is the intellectual justification for secure-anything's whole approach:
      policy as data, gates as exit codes, detection as merely one input.
    covers: [LLM01, ASI01, ASI02]
    triggers: ["camel", "defeat prompt injection by design", "control flow integrity", "capability security", "why detection is not enough", "why is detection not enough", "detection is not enough"]

  - id: no-evidence-means-no
    kind: concept
    title: "No evidence means no (the unmeasured item can never pass a blocking gate)"
    by: "secure-anything (house discipline, from anyagent's BRACE work)"
    url: docs/REPO_PLAYBOOK.md
    year: 2026
    evidence: verified
    verified_at: "2026-08-03"
    summary: >-
      An item a gate could not measure is reported as `not measured` and excluded from the score
      — never silently converted into a pass. A blocking gate cannot go green on unmeasured items.
    why_it_matters: "The difference between a security report and a security theatre report."
    covers: []
    triggers: ["not measured", "unmeasured", "can we pass this anyway", "no evidence"]

