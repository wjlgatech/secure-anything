# controls.yml — the DENOMINATOR of the north-star metric (Verified Control Coverage).
#
# A control is only in scope if it comes from a published, citable framework. We do not
# invent controls. Each framework carries an evidence tier for its OWN contents:
#   verified     = the list was read at the primary source URL on verified_at
#   corroborated = >=3 independent secondary sources agree; primary is paywalled/PDF-only
#
# VCC = |controls with >=1 integrated capability holding a run receipt| / |controls in scope|
# Computed by scripts/northstar.py. Naming a satellite moves this by ZERO.

