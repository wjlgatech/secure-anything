# registry.yml — THE single source of truth for secure-anything's capabilities.
#
# Every published surface (README tables, skills/secure-anything/SKILL.md) is GENERATED from
# this file and drift-gated by `python3 scripts/build.py --check`. Never hand-edit downstream.
#
# STATUS LADDER (the product):
#   candidate  (⚪) = named, role assigned, metadata verified. Moves the north star by ZERO.
#   digested   (🟡) = docs/satellites/<id>.md exists + pinned_sha + license. Still ZERO.
#   integrated (🟢) = digest + its gate RAN HERE with a recorded exit code in runs/<id>/.
#                     Only this moves the north star.
# A promotion whose on-disk evidence is missing is REFUSED by scripts/verify_registry.py.
#
# LICENSE DISCIPLINE: `license: NOASSERTION` means GitHub could not resolve a standard SPDX
# identifier. Unknown license ⇒ treated as restrictive ⇒ pointer-only, never vendored, never
# executed in our CI, until a human confirms it (`license_confirmed: true`). No evidence ⇒ no.
#
# `covers:` maps a capability to controls in data/controls.yml. These mappings are AUTHORED BY US
# (asserted_by: secure-anything, 2026-08-03), are a judgement call, and are disputable via
# .github/ISSUE_TEMPLATE/gate-dispute.md. They are not the upstream project's own claim.
#
# All stars/license/pushed_at below were read from the GitHub API on 2026-08-03.

