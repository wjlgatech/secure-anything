name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      # ruff is pinned in pyproject and `required-version` makes it refuse to run under
      # any other build, so CI and a laptop cannot disagree about what "lint clean" means.
      - run: ruff --version
      # CI runs EXACTLY the canonical gate — never a subset. If `make check` and CI can
      # diverge, the local green stops meaning anything.
      - run: make check
