[project]
name = "agentgate"
version = "0.1.0"
description = "The trust & accountability gate for human + AI-agent code changes. First wedge: a PR firewall for coding agents."
requires-python = ">=3.11"
license = { text = "Proprietary — All Rights Reserved" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "SQLAlchemy>=2.0",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Production scale-out: swap the in-process queue for Redis-backed workers.
redis = ["redis>=5.0"]
# GitHub App auth: sign the App JWT (RS256) to mint installation tokens.
github = ["pyjwt[crypto]>=2.8"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
